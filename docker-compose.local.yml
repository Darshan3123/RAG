# =========================================================================
# docker-compose.local.yml
# GeMBridge Local Development Stack with Multi-Process Linux Workers
# Automatically connects to Windows Desktop PostgreSQL via host.docker.internal
# =========================================================================

services:
  # 1. Redis 7 Message Broker & Result Backend
  redis:
    image: redis:7-alpine
    container_name: redis-server-gem
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
    volumes:
      - gem_redis_data:/data

  # 2. MinIO S3 Object Storage
  minio:
    image: alpine/minio:latest-release
    container_name: minio-server-gem
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gem_minio_data:/data
    restart: unless-stopped

  # 3. Tier 1: Scraper Worker (Playwright Chromium)
  worker-scraper:
    build: .
    container_name: gem-worker-scraper
    command: celery -A tasks.celery_app worker -Q scraping_queue -c 2 -n scraper@local --loglevel=INFO
    init: true
    shm_size: '2gb'
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
    depends_on:
      - redis
      - minio
    volumes:
      - ./downloads:/app/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1200M

  # 4. Tier 2: Document & Mistral OCR Worker
  worker-document:
    build: .
    container_name: gem-worker-document
    command: celery -A tasks.celery_app worker -Q document_queue -c 2 -n document@local --loglevel=INFO
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
    depends_on:
      - redis
      - minio
    volumes:
      - ./downloads:/app/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 600M

  # 5. Tier 3: ATC Compliance & pgvector Worker
  worker-atc:
    build: .
    container_name: gem-worker-atc
    command: celery -A tasks.celery_app worker -Q atc_rag_queue -c 2 -n atc@local --loglevel=INFO
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
    depends_on:
      - redis
      - minio
    volumes:
      - gem_hf_cache:/root/.cache/huggingface
      - ./downloads:/app/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1200M

  # 6. Celery Beat Periodic Scheduler (Every 30 Minutes)
  celery-beat:
    build: .
    container_name: gem-celery-beat
    command: celery -A tasks.celery_app beat -l info
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 250M

  # 7. FastAPI REST Gateway (Port 8000)
  gateway:
    build: .
    container_name: gem-fastapi-gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
    depends_on:
      - redis
      - minio
    volumes:
      - gem_hf_cache:/root/.cache/huggingface
      - ./downloads:/app/downloads
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 400M

volumes:
  gem_redis_data:
  gem_minio_data:
  gem_hf_cache:
