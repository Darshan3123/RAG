# =========================================================================
# docker-compose.local.yml
# Optimized Local Development Stack for 2 Cores & 4 GB RAM
# Stable balanced configuration: Scraper -c 1, Doc -c 1, ATC -c 2
# =========================================================================

services:
  # 1. Redis 7 Broker & Result Backend
  redis:
    image: redis:7-alpine
    container_name: redis-server-gem
    ports:
      - "6379:6379"
    restart: always

  # 2. MinIO S3 Object Storage
  minio:
    image: alpine/minio:latest-release
    container_name: minio-server-gem
    user: "0:0"
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gem_minio_data:/data
    restart: always

  # 3. Tier 1: Scraper Worker (Concurrency = 1 to preserve CPU/RAM)
  worker-scraper:
    build: .
    container_name: gem-worker-scraper
    command: celery -A tasks.celery_app worker -Q scraping_queue -c 1 -n scraper@local --loglevel=INFO
    init: true
    shm_size: '1gb'
    volumes:
      - ./downloads:/app/downloads
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
      - AUTO_START_SCRAPER_ON_BOOT=true
    depends_on:
      - redis
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 800M

  # 4. Tier 2: Document & OCR Worker (Concurrency = 1, Fast I/O)
  worker-document:
    build: .
    container_name: gem-worker-document
    volumes:
      - ./downloads:/app/downloads
    command: celery -A tasks.celery_app worker -Q document_queue -c 1 -n document@local --loglevel=INFO
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
      - AUTO_START_SCRAPER_ON_BOOT=true
    depends_on:
      - redis
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 600M

  # 5. Tier 3: ATC Compliance & RAG Worker (Concurrency = 2, Single-Thread PyTorch)
  worker-atc:
    build: .
    container_name: gem-worker-atc
    volumes:
      - ./downloads:/app/downloads
      - gem_hf_cache:/root/.cache/huggingface
    command: celery -A tasks.celery_app worker -Q atc_rag_queue -c 2 -n atc@local --loglevel=INFO
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
      - AUTO_START_SCRAPER_ON_BOOT=true
    depends_on:
      - redis
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    mem_limit: 1400M

  # 6. FastAPI REST Gateway (Port 8000)
  fastapi-gateway:
    build: .
    container_name: gem-local-gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - DATABASE_URL=postgresql://postgres:postgres@host.docker.internal:5432/gem-bridge
      - MINIO_ENDPOINT=minio:9000
      - MINIO_PUBLIC_ENDPOINT=localhost:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=gem-tenders
      - MINIO_SECURE=false
      - AUTO_START_SCRAPER_ON_BOOT=true
      - GATEWAY_ENABLE_ADMIN_ROUTES=true
    depends_on:
      - redis
      - minio
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app

  # 7. Celery Beat Periodic Scheduler Daemon
  celery-beat:
    build: .
    container_name: gem-local-beat
    command: celery -A tasks.celery_app beat --loglevel=INFO
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    restart: always

  # 8. Flower Queue Telemetry Dashboard (Port 5555)
  flower:
    build: .
    container_name: gem-local-flower
    command: celery -A tasks.celery_app flower --port=5555
    ports:
      - "5555:5555"
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis
    restart: always

volumes:
  gem_minio_data:
  gem_hf_cache:
